services:
  - type: web
    name: operadash-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "npx prisma migrate deploy && node dist/server.js"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 24h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: STRIPE_SECRET_KEY
        value: sk_test_xxx
      - key: STRIPE_WEBHOOK_SECRET
        value: whsec_xxx
      - key: SUPER_ADMIN_EMAIL
        value: admin@operadash.com
      - key: SUPER_ADMIN_PASSWORD
        sync: false
